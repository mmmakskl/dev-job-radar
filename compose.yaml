services:
  data-init:
    image: dev-job-radar-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    command: ["sh", "scripts/init_data_volume.sh"]
    volumes:
      - ./data:/app/data
    restart: "no"
  bot:
    image: dev-job-radar-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    command: ["sh", "scripts/run_live_container.sh"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      SESSION_PATH: ""
      STATE_FILE_PATH: /app/data/state.jsonl
      VACANCY_GROUPS_DB_PATH: /app/data/vacancy_groups.sqlite3
      GOOGLE_CREDENTIALS_PATH: /run/secrets/google-credentials.json
    volumes:
      - ./data:/app/data
      - ./secrets/google-credentials.json:/run/secrets/google-credentials.json:ro
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/bot-started-at && python -m tg_vacancy_bot.deploy_health $$(cat /tmp/bot-started-at)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  admin:
    image: dev-job-radar-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    command: ["python", "-m", "uvicorn", "tg_vacancy_bot.admin.api:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      ADMIN_STATIC_DIR: /app/web
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-localhost,127.0.0.1,go-radar-maksim.duckdns.org}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/healthz').status == 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  candidate-bot:
    image: dev-job-radar-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["candidate"]
    init: true
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    command: ["sh", "scripts/run_candidate_bot_container.sh"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      CANDIDATE_BOT_DB_PATH: /app/data/candidate_bot.sqlite3
    volumes:
      - ./data:/app/data
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/candidate-bot-started-at && python -m tg_vacancy_bot.deploy_health $$(cat /tmp/candidate-bot-started-at) /app/data/admin/candidate-heartbeat.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
